<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLook - Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #082f4d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .cadastro-card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 18px;
            cursor: pointer;
            font-size: 14px;
            color: gray;
        }

        .password-rules {
            font-size: 12px;
            color: gray;
            margin-top: -5px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #062b4f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #041f38;
        }

        .bottom-text {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        .bottom-text a {
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="cadastro-card">
        <h2>Cadastro</h2>
        <form id="cadastroForm">
            <div class="row">
                <input type="text" id="nome" placeholder="Nome" required>
                <input type="text" id="sobrenome" placeholder="Sobrenome" required>
            </div>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="text" id="empresa" placeholder="Empresa" required>

            <div class="input-group">
                <input type="password" id="senha" placeholder="Senha" required>
                <span class="toggle-password" onclick="togglePassword('senha')">👁</span>
            </div>
            <div class="password-rules">
                • Pelo menos 8 caracteres<br>
                • Letras e números
            </div>

            <div class="input-group">
                <input type="password" id="confirmacao" placeholder="Confirmação" required>
                <span class="toggle-password" onclick="togglePassword('confirmacao')">👁</span>
            </div>

            <button type="submit">Criar Conta</button>
        </form>

        <div class="bottom-text">
            Já tem uma conta? <a href="#">Entrar</a>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        document.getElementById("cadastroForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const sobrenome = document.getElementById("sobrenome").value.trim();
            const email = document.getElementById("email").value.trim();
            const empresa = document.getElementById("empresa").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmacao = document.getElementById("confirmacao").value;

            if (!nome || !sobrenome || !email || !empresa || !senha || !confirmacao) {
                alert("Preencha todos os campos!");
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Digite um e-mail válido!");
                return;
            }

            if (senha.length < 8) {
                alert("A senha deve ter pelo menos 8 caracteres!");
                return;
            }

            if (!/[A-Za-z]/.test(senha) || !/[0-9]/.test(senha)) {
                alert("A senha deve conter letras e números!");
                return;
            }

            if (senha !== confirmacao) {
                alert("A confirmação de senha não confere!");
                return;
            }

            alert(`Conta criada com sucesso!\nBem-vindo, ${nome}!`);
        });
    </script>

</body>
</html>
