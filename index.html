<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLook - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #082f4d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .logo span {
            color: orange;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 18px;
            cursor: pointer;
            font-size: 14px;
            color: gray;
        }

        .checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .checkbox a {
            text-decoration: none;
            color: #1a73e8;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #062b4f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #041f38;
        }

        .bottom-text {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        .bottom-text a {
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/RFID_icon.svg/1024px-RFID_icon.svg.png" alt="RFID" width="30">
            <span>SmartLook</span>
        </div>
        <p>Gestão inteligente de estoque com RFID</p>
        
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuário" required>

            <div class="input-group">
                <input type="password" id="senha" placeholder="Senha" required>
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>
            
            <div class="checkbox">
                <label><input type="checkbox" id="lembrar"> Lembrar-me</label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            
            <button type="submit">Entrar</button>
        </form>
        
        <div class="bottom-text">
            Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const senhaInput = document.getElementById("senha");
            senhaInput.type = senhaInput.type === "password" ? "text" : "password";
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value.trim();

            if (usuario === "" || senha === "") {
                alert("Preencha todos os campos!");
                return;
            }

            // Aqui poderia ser feita a validação no backend
            alert(`Usuário: ${usuario}\nSenha: ${senha}`);
        });
    </script>

</body>
</html>
