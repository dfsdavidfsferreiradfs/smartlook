<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLook - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #082f4d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .logo span {
            color: orange;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .checkbox a {
            text-decoration: none;
            color: #1a73e8;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #062b4f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #041f38;
        }

        .bottom-text {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        .bottom-text a {
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/RFID_icon.svg/1024px-RFID_icon.svg.png" alt="RFID" width="30">
            <span>SmartLook</span>
        </div>
        <p>Gestão inteligente de estoque com RFID</p>
        
        <form action="login.php" method="POST">
            <input type="text" name="usuario" placeholder="Usuário" required>
            <input type="password" name="senha" placeholder="Senha" required>
            
            <div class="checkbox">
                <label><input type="checkbox" name="lembrar"> Lembrar-me</label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            
            <button type="submit">Entrar</button>
        </form>
        
        <div class="bottom-text">
            Não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
    </div>

</body>
</html>
